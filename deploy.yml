name: Deploy IDDS Inventaris TI

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Ambil kode
        uses: actions/checkout@v4

      - name: Siapkan Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instal dependensi
        run: npm ci

      - name: Bangun aplikasi
        run: npm run build

      - name: Siapkan GitHub Pages
        uses: actions/configure-pages@v5

      - name: Unggah hasil build
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Terbitkan website
        id: deployment
        uses: actions/deploy-pages@v4